name: Benchmark

on:
  push:

permissions:
  contents: read

jobs:
  aggregate-results:
    name: Aggregate benchmark results
    # strategy:
    #   fail-fast: false
    #   matrix:
    #     include:
    #       - runner: ubuntu-24.04
    #         system: x86_64-linux
    #       - runner: ubuntu-24.04-arm
    #         system: aarch64-linux
    #       # - runner: macos-15-intel
    #       #   system: x86_64-darwin
    #       - runner: macos-latest
    #         system: aarch64-darwin
    runs-on: ubuntu-latest # slim # ${{ matrix.runner }}
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
          sparse-checkout: |
            tools/nix/
            shell.nix
          sparse-checkout-cone-mode: false

      - name: Download benchmark raw results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: csv-*
          merge-multiple: true
          path: raw-results
          repository: nodejs/node
          github-token: ${{ secrets.GH_USER_TOKEN }}
          run-id: 29243127788

      - uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3  # v31.10.6
        with:
          extra_nix_config: sandbox = true
          # extra_nix_config: |
          #   sandbox = true
          #   trusted-public-keys = nodejs-test.cachix.org-1:WvIzKH8IKBPG+VBNgA33RHVP11pL42HiqYSfvLYjwBc= cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=
          #   substituters = https://nodejs-test.cachix.org https://cache.nixos.org/

      - uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71  # v17
        with:
          name: nodejs-test
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Benchmark results
        run: |
          # nix-shell \
          #  --pure \
          DRV=$(nix-build --no-out-link \
            -I nixpkgs=./tools/nix/pkgs.nix \
            -E '(import <nixpkgs> {}).mkShellNoCC {
              buildInputs = import ./tools/nix/benchmarkTools.nix {
                withHttpBenchmarkDeps = false;
              }; }')
          while IFS= read -r drv; do
            nix why-depends --precise "$DRV" "$drv"
            sleep 1
          done <<'EOF'
          /nix/store/38n0ganzvrlk08c8l3wbwxzsqmxgqi6j-acl-2.4.0
          /nix/store/r88gpfhsd1bww3bz9cl5crrxnwg5kiap-attr-2.6.0
          /nix/store/7ik8057hajl6vq9j40h3jracxjn0bb5x-bash-5.3p15
