          /nix/store/j6kmpz6b8fr51mnf0ya5vw28aafaplrs-r-RColorBrewer-1.1-3
          /nix/store/bxga5a1jd4spk8125i696iclrds98rky-r-Rcpp-1.1.2
          /nix/store/5dwk28c3jx1yv0inhy62cbyd34gzdlam-r-S7-0.2.2
